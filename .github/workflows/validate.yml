name: OpenDP FL Stage 1 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Record exact versions
        run: |
          python --version | tee python-version.txt
          python -m pip freeze > pip-freeze.txt
          python - <<'PY'
          import importlib.metadata
          for name in ("torch", "opendp", "opacus"):
              print(f"{name}: {importlib.metadata.version(name)}")
          PY

      - name: Execute automated tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rA 2>&1 | tee pytest-output.txt

      - name: Execute notebook
        shell: bash
        run: |
          set -o pipefail
          jupyter nbconvert --to notebook --execute \
            opendp_opacus_fl.ipynb \
            --output opendp_opacus_fl_executed.ipynb \
            --ExecutePreprocessor.timeout=900 \
            2>&1 | tee notebook-output.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendp-fl-stage1-validation
          path: |
            pytest-output.txt
            notebook-output.txt
            python-version.txt
            pip-freeze.txt
            opendp_opacus_fl_executed.ipynb
          if-no-files-found: warn
          retention-days: 30
